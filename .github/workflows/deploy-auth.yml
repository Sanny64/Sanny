name: Build and Deploy auth frontend to Hetzner (prod-environment)

on:
  push:
    branches:
      - main
    paths:
      - "auth/**"
      - "shared/packages/**"
      - "package.json"
      - "package-lock.json"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint the projects
        run: npm run lint:auth && npm run lint -w @sanny/i18n && npm run lint -w @sanny/styles && npm run lint -w @sanny/ui

      - name: Build the project
        run: npm run build:auth

      - name: Upload auth build
        uses: actions/upload-artifact@v4
        with:
          name: auth-dist
          path: auth/dist/
          if-no-files-found: error

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Download auth build
        uses: actions/download-artifact@v4
        with:
          name: auth-dist
          path: auth/dist/

      - name: Deploy to Hetzner via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./auth/dist/
          server-dir: /public_html/auth/

name: Build and deploy backend

permissions: {}

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      deployment-directory:
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PAT:
        required: true
      VPS_HOST:
        required: false
      VPS_USERNAME:
        required: false
      VPS_SSH_KEY:
        required: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: |
            ghcr.io/sanny64/sanny/backend
            docker.io/sanny64/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest

    if: inputs.deploy && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      BACKEND_IMAGE_TAG: ${{ github.sha }}
      BACKEND_DEPLOY_DIRECTORY: ${{ inputs.deployment-directory }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BACKEND_IMAGE_TAG,BACKEND_DEPLOY_DIRECTORY,DOCKERHUB_USERNAME,DOCKERHUB_PAT
          script: |
            set -eu
            : "${BACKEND_DEPLOY_DIRECTORY:?Supply backend-directory for the approved release checkout}"
            cd "$BACKEND_DEPLOY_DIRECTORY"
            test "$(git rev-parse HEAD)" = "$BACKEND_IMAGE_TAG"
            git diff --quiet HEAD -- apps/backend/docker/compose apps/backend/nginx/nginx.conf apps/backend/redis/redis.conf apps/backend/monitoring
            echo "$DOCKERHUB_PAT" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            cd apps/backend
            docker compose --project-directory . --env-file .env -f docker/compose/docker-compose.prod.yml config --quiet
            docker compose --project-directory . --env-file .env -f docker/compose/docker-compose.prod.yml pull sanny64-backend
            docker compose --project-directory . --env-file .env -f docker/compose/docker-compose.prod.yml up -d --no-build --wait --wait-timeout 120 sanny64-backend

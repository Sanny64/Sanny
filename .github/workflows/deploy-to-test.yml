name: Build and Deploy frontends to Hetzner (test-environment)

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - test

concurrency:
  group: deploy-frontends-test
  cancel-in-progress: false

jobs:
  lint-and-build:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Lint the projects
        run: |
          npm run lint:auth
          npm run lint:sanny
          npm run lint:docs
          npm run lint -w @sanny/i18n
          npm run lint -w @sanny/styles
          npm run lint -w @sanny/ui

      - name: Build shared packages
        run: |
          npm run build -w @sanny/i18n
          npm run build -w @sanny/styles
          npm run build -w @sanny/ui

      - name: Build frontends for test subdomains
        run: |
          if [ -z "$VITE_PROD_API_URL" ]; then
            echo "Set the VITE_DEV_API_URL repository variable before deploying test."
            exit 1
          fi
          npm run build -w sanny -- --base=/
          npm run build -w auth -- --base=/
          npm run build:docs
        env:
          VITE_PROD_API_URL: ${{ vars.VITE_DEV_API_URL }}
          DOCUSAURUS_URL: https://test.docs.sanny64.de
          DOCUSAURUS_BASE_URL: /

      - name: Stage testing sites
        run: |
          mkdir -p testing-site/sanny testing-site/auth testing-site/docs
          cp -a sanny/dist/. testing-site/sanny/
          cp -a auth/dist/. testing-site/auth/
          cp -a documentation/build/. testing-site/docs/
          if [[ "$TEST_BASIC_AUTH_ENTRY" == *$'\n'* || "$TEST_BASIC_AUTH_ENTRY" == *$'\r'* || ! "$TEST_BASIC_AUTH_ENTRY" =~ ^[^:]+:[^:]+$ ]]; then
            echo "TEST_BASIC_AUTH_ENTRY must contain one username:hashed-password line."
            exit 1
          fi
          if [[ ! "$TEST_BASIC_AUTH_FILE_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "TEST_BASIC_AUTH_FILE_PATH must be an absolute server path using only letters, numbers, '.', '_', '/', or '-'."
            exit 1
          fi
          printf '%s\n' "$TEST_BASIC_AUTH_ENTRY" > testing-site/sanny/.htpasswd
          printf '%s\n' \
            'DirectoryIndex index.html' \
            'AuthType Basic' \
            'AuthName "Test environment"' \
            "AuthUserFile $TEST_BASIC_AUTH_FILE_PATH" \
            'Require valid-user' \
            '<Files ".htpasswd">' \
            '    Require all denied' \
            '</Files>' > testing-site/sanny/.htaccess
          cp testing-site/sanny/.htaccess testing-site/docs/.htaccess
          printf '%s\n' \
            'RewriteEngine On' \
            'RewriteCond %{REQUEST_FILENAME} !-f' \
            'RewriteCond %{REQUEST_FILENAME} !-d' \
            'RewriteRule ^ index.html [L]' >> testing-site/sanny/.htaccess
          cp testing-site/sanny/.htaccess testing-site/auth/.htaccess
          printf '%s\n' 'ErrorDocument 404 /404.html' >> testing-site/docs/.htaccess
        env:
          TEST_BASIC_AUTH_ENTRY: ${{ secrets['TEST_BASIC_AUTH_ENTRY'] }}
          TEST_BASIC_AUTH_FILE_PATH: ${{ secrets['TEST_BASIC_AUTH_FILE_PATH'] }}

      - name: Upload frontend builds
        uses: actions/upload-artifact@v4
        with:
          name: testing-site
          path: testing-site/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - site: sanny
            server-dir: "/public_html/testing/"
          - site: auth
            server-dir: "/public_html/testing/auth/"
          - site: docs
            server-dir: "/public_html/testing/docs/"

    steps:
      - name: Download frontend builds
        uses: actions/download-artifact@v4
        with:
          name: testing-site
          path: testing-site/

      - name: Check FTPS data connection
        shell: bash
        run: |
          curl --disable --silent --show-error --fail \
            --ssl-reqd --insecure --ftp-pasv \
            --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only --output /dev/null \
            --url "ftp://${FTP_SERVER}${FTP_SERVER_DIR}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ matrix.server-dir }}

      - name: Deploy to Hetzner via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./testing-site/${{ matrix.site }}/
          server-dir: ${{ matrix.server-dir }}
          state-name: .ftp-deploy-sync-state-${{ matrix.site }}.json

name: Build and Deploy sanny frontend to Hetzner (prod-environment)

permissions: {}

on:
  workflow_call:
    secrets:
      FTP_SERVER:
        required: true
      FTP_USERNAME:
        required: true
      FTP_PASSWORD:
        required: true

concurrency:
  group: deploy-sanny-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tooling/config/.nvmrc

      - name: Set up npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Copy favicon from root
        run: cp ./favicon.ico ./apps/frontend/sanny/public/

      - name: Build the project
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the VITE_PROD_API_URL repository variable before deploying production."
            exit 1
          fi
          npm run build -w sanny
        env:
          VITE_API_URL: ${{ vars.VITE_PROD_API_URL }}

      - name: Deploy to Hetzner via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./apps/frontend/sanny/dist/
          server-dir: /public_html/apps/frontend/sanny/

name: Verify workspace

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: https://127.0.0.1:8443
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.6.3
      - name: Install dependencies
        run: npm ci
      - name: Warn about documentation translation line counts
        continue-on-error: true
        run: node scripts/warn-docs-translation.mjs
      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox webkit msedge
      - name: Verify workspace
        run: npm run test:ci

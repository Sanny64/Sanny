name: Build and Deploy docs to Hetzner (prod-environment)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Copy favicon from root
        run: cp ./favicon.ico ./docs/static/img/

      - name: Build docs
        run: npm run build:docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy docs to Hetzner via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./docs/build/
          server-dir: /public_html/docs/

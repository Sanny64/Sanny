name: Build and Deploy docs to Hetzner (prod-environment)

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - "documentation/**"
      - "shared/packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-docs.yml"

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Copy favicon from root
        run: cp ./favicon.ico ./documentation/static/img/

      - name: Build docs
        run: npm run build:docs
        env:
          DOCUSAURUS_URL: https://docs.sanny64.de
          DOCUSAURUS_BASE_URL: /

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: documentation/build/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: documentation/build/

      - name: Deploy docs to Hetzner via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./documentation/build/
          server-dir: /public_html/docs/

name: sanny64
services:
  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    networks:
      app-network:
        ipv4_address: 172.28.0.2

  sanny64-backend:
    image: sanny64/backend:${BACKEND_IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PROD_TRUST_PROXY: 172.28.0.2
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      APP_LOG_FILE: /app/logs/app.log
    volumes:
      - ../redis/certs/ca.crt:/app/redis-ca.crt:ro
      - application-logs:/app/logs
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  redis-exporter:
    extends:
      file: docker-compose.yml
      service: redis-exporter

  nginx-exporter:
    extends:
      file: docker-compose.yml
      service: nginx-exporter

  node-exporter:
    extends:
      file: docker-compose.yml
      service: node-exporter

  prometheus:
    extends:
      file: docker-compose.yml
      service: prometheus

  loki:
    extends:
      file: docker-compose.yml
      service: loki

  alloy:
    extends:
      file: docker-compose.yml
      service: alloy

  grafana:
    extends:
      file: docker-compose.yml
      service: grafana
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_PROD_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
  nginx-logs:
  application-logs:
  promtail-data:
  alloy-data:
  prometheus-data:
  loki-data:
  grafana-data:

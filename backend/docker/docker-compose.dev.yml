name: sanny64
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - ../nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - sanny64-backend
    networks:
      - app-network
    restart: unless-stopped

  sanny64-backend:
    image: sanny64/backend:latest
    container_name: sanny64-backend
    pull_policy: build
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      APP_LOG_FILE: /app/logs/app.log
    volumes:
      - ../redis/certs/ca.crt:/app/redis-ca.crt:ro
      - application-logs:/app/logs
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Nutzen Sie ein einzelnes $, damit Compose die Variable direkt einsetzt
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ../redis/redis.conf:/etc/redis/redis.conf:ro
      - ../redis/certs:/etc/redis/certs:ro
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /etc/redis/certs/ca.crt
      REDIS_EXPORTER_REDACT_CONFIG_METRICS: "true"
    volumes:
      - ../redis/certs/ca.crt:/etc/redis/certs/ca.crt:ro
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command:
      - "--nginx.scrape-uri=http://nginx:8081/nginx_status"
    depends_on:
      - nginx
    networks:
      - app-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    networks:
      - app-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.0
    volumes:
      - ../monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - nginx-logs:/var/log/nginx:ro
      - application-logs:/var/log/app:ro
      - promtail-data:/var/lib/promtail:ro
      - alloy-data:/var/lib/alloy
    command:
      - run
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - "DISCORD_WEBHOOK=${DISCORD_WEBHOOK:?Set DISCORD_WEBHOOK via --env-file backend/.env}"
      - GF_SERVER_ROOT_URL=${GRAFANA_DEV_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Sanny Monitoring
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/alerting/contactpoints.yml:/etc/grafana/provisioning/alerting/contactpoints.yml:ro
      - ../monitoring/alerting/policies.yml:/etc/grafana/provisioning/alerting/policies.yml:ro
      - ../monitoring/alerting/rules/429-spikes.yml:/etc/grafana/provisioning/alerting/429-spikes.yml:ro
      - ../monitoring/alerting/rules/auth-abuse.yml:/etc/grafana/provisioning/alerting/auth-abuse.yml:ro
      - ../monitoring/alerting/rules/backend-operational.yml:/etc/grafana/provisioning/alerting/backend-operational.yml:ro
      - ../monitoring/alerting/rules/callback-flood.yml:/etc/grafana/provisioning/alerting/callback-flood.yml:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
  nginx-logs:
  application-logs:
  promtail-data:
  alloy-data:
  prometheus-data:
  loki-data:
  grafana-data:

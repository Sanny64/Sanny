events {}

http {
    # -------------------------------------------------------------------
    # Edge rate limiting = emergency safety net only.
    #
    # These zones do NOT enforce business logic (that is exclusively
    # handled by the app in rate-limit.ts, granular per route/session/
    # user). The only goal here is to protect Node/Redis from a real
    # flood (DDoS, credential stuffing) before it even reaches them.
    #
    # Limits are deliberately set well above the app-level limits and
    # should NEVER trigger in normal operation. Keyed on IP alone
    # ($binary_remote_addr) - no session awareness needed or wanted here.
    # -------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=users_zone:10m rate=100r/m;

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Emergency net for auth routes (flood/DDoS protection only,
        # no fine granularity - that's handled per sub-route in the app)
        location ~ ^/api/v001/auth(/callback|/logout)?$ {
            limit_req zone=auth_zone burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Emergency net for user routes
        location /api/v001/users {
            limit_req zone=users_zone burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Retry-After header on 429
        error_page 429 = @toomany;
        location @toomany {
            add_header Retry-After 60 always;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later."}';
            default_type application/json;
        }

        # Everything else, passed through normally
        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}